# Builds Halo Sync on Windows, macOS and Linux and uploads the binaries.
# Each push to main also publishes the binaries as the "latest" GitHub pre-release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libqt6sql6-sqlite libtag1-dev libavformat-dev libavcodec-dev libswresample-dev libavutil-dev ffmpeg ninja-build gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
      - uses: actions/upload-artifact@v4
        with: { name: halo-sync-linux, path: build/halo-sync }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: '6.7.3', modules: 'qtmultimedia', arch: 'win64_msvc2019_64' }
      - name: TagLib via vcpkg
        run: vcpkg install taglib:x64-windows
      - name: FFmpeg (LGPL shared build with headers and import libraries)
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip -OutFile ff.zip
          Expand-Archive ff.zip ffzip
          $d = Get-ChildItem ffzip -Directory | Select-Object -First 1
          Move-Item $d.FullName ffmpeg-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHALO_BUILD_TESTS=OFF -DFFMPEG_ROOT="$pwd/ffmpeg-dev" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release
      - name: Bundle Qt and TagLib
        run: |
          mkdir dist
          copy build\Release\halo-sync.exe dist\
          copy "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" dist\
          windeployqt --release --no-translations dist\halo-sync.exe
          # Visual C++ runtime, so the app runs on PCs without the redistributable
          foreach ($f in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll') { copy "$env:SystemRoot\System32\$f" dist\ }
      - name: Bundle FFmpeg (libraries for playback, ffmpeg.exe for conversion)
        run: |
          copy ffmpeg-dev\bin\*.dll dist\
          copy ffmpeg-dev\bin\ffmpeg.exe dist\
          copy ffmpeg-dev\LICENSE.txt dist\ffmpeg-LICENSE.txt
          copy README.md dist\
      - name: Smoke test (start, decode with FFmpeg, measure loudness, exit)
        run: |
          mkdir smoke-music
          dist\ffmpeg.exe -hide_banner -v error -f lavfi -i "sine=frequency=997:duration=3" -metadata album=Smoke smoke-music\a.flac
          $p = Start-Process dist\halo-sync.exe -ArgumentList '--data-dir','smoke','--add-folder',"$pwd\smoke-music",'--replaygain' -Wait -PassThru -RedirectStandardOutput rg.txt
          Get-Content rg.txt
          if ($p.ExitCode -ne 0) { throw "halo-sync.exe exited with $($p.ExitCode)" }
          # a -21.07 LUFS tone needs +3.07 dB to reach -18 LUFS
          if (-not (Select-String -Path rg.txt -Pattern 'track 3\.0[0-9] dB' -Quiet)) { throw "unexpected ReplayGain result" }
      - run: Compress-Archive dist\* halo-sync-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: halo-sync-windows, path: halo-sync-windows-x64.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install qt taglib pkg-config ninja ffmpeg
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" && cmake --build build
      - run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
      - run: "$(brew --prefix qt)/bin/macdeployqt build/halo-sync.app -dmg"
      - uses: actions/upload-artifact@v4
        with: { name: halo-sync-macos, path: build/halo-sync.dmg }

  # Every push to main replaces the "latest" pre-release with fresh binaries.
  release:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.windows.result == 'success'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Publish the latest build
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          files=(out/halo-sync-windows/halo-sync-windows-x64.zip)
          if [ -f out/halo-sync-linux/halo-sync ]; then
            (cd out/halo-sync-linux && chmod +x halo-sync && tar czf ../../halo-sync-linux-x86_64.tar.gz halo-sync)
            files+=(halo-sync-linux-x86_64.tar.gz)
          fi
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest --target "$GITHUB_SHA" --prerelease --title "Latest build" \
            --notes "Built automatically from commit $GITHUB_SHA. Windows: unzip and run halo-sync.exe." "${files[@]}"
